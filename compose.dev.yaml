services:
  mysql:
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - backend_net
      - dev_net
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - backend_net
      - dev_net
  rocketmq-namesrv:
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    networks:
      - backend_net
      - dev_net
  rocketmq-broker:
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
    networks:
      - backend_net
      - dev_net
  rocketmq-topic-init:
    networks:
      - backend_net
      - dev_net
  qdrant:
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    networks:
      - backend_net
      - dev_net
  business-service:
    ports:
      - "${BUSINESS_PORT:-8080}:8080"
    networks:
      - backend_net
      - dev_net
  agent-service:
    ports:
      - "${AGENT_PORT:-8000}:8000"
    networks:
      - backend_net
      - agent_egress_net
      - dev_net

networks:
  dev_net:
    driver: bridge
